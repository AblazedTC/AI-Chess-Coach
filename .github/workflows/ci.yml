name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHESSCOM_MODE: demo
  ENGINE_MODE: demo
  LLM_PROVIDER: deterministic
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:root

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- openapi.json
      - run: uv run pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: docker build --tag ai-chess-coach-render backend
      - id: container
        run: >-
          docker run --detach --name coach-render-smoke
          --publish 127.0.0.1:8100:19000 --env PORT=19000
          ai-chess-coach-render
      - run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 3 \
            http://127.0.0.1:8100/api/health
          docker exec coach-render-smoke .venv/bin/python -c \
            "import importlib.util, os; assert os.getuid() != 0; assert not os.path.exists('/app/.env'); assert importlib.util.find_spec('pytest') is None"
          node qa/container-smoke.mjs http://127.0.0.1:8100
      - if: failure() && steps.container.outcome == 'success'
        run: docker logs coach-render-smoke
      - if: always() && steps.container.outcome == 'success'
        run: docker rm --force coach-render-smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: uv --directory backend sync --locked
      - run: npm --prefix frontend ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
